<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amara</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

<div id="navbar-container"></div>

<div class="header-armas">
  <h1>Amara</h1>
</div>

<div id="contenedoramara">
  <div id="zoomarea">
    <img id="imagenamara" src="otrasimagenes/amara 1.png">
  </div>
</div>


<!-- BOTONES -->
<div class="zoom-controls">
  <button id="zoomIn">+</button>
  <button id="zoomOut">−</button>
</div>

<a href="#" class="btn" onclick="history.back()">Volver</a>

<script src="https://unpkg.com/@panzoom/panzoom/dist/panzoom.min.js"></script>

<script>
  
  const elem = document.getElementById('zoomarea');

const panzoom = Panzoom(elem, {
    maxScale: 5,
    minScale: 1,
    contain: 'none'
});

elem.parentElement.addEventListener('wheel', panzoom.zoomWithWheel);

window.addEventListener('load', () => {
    panzoom.zoom(2);
});

document.getElementById('zoomIn').addEventListener('click', () => {
    panzoom.zoomIn();
});

document.getElementById('zoomOut').addEventListener('click', () => {
    panzoom.zoomOut();
});
</script>

<script src="01-tipos/navbar.js"></script>
<script src="01-tipos/01-componentes.js"></script>

</body>
</html>
