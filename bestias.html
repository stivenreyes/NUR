    <div id="navbar-container"></div>
     <h1>Bestias</h1>
    <h3>Bestias vinculadas (Velkor) disponibles por el momento</h3>

    <p><em>Uru Kor Vera, El Kri Zhur</em></p>

<div class="buscador-container">
    <i class="fa-solid fa-magnifying-glass"></i>
    <input 
        type="text" 
        id="buscador" 
        placeholder="Buscar bestia..."
    >
</div>

<!-- * ================= FILTRO ================= * -->
<div class="filtros-bestias">

    <div class="filtro-container">
        <i class="fa-solid fa-filter"></i>
        <select id="filtro-bioma">
            <option value="">Todos los biomas</option>
            <option value="Bosque">Bosque</option>
            <option value="Desierto">Desierto</option>
            <option value="Montaña">Montaña</option>
            <option value="Costa">Costa</option>
        </select>
    </div>

    <div class="filtro-container">
        <i class="fa-solid fa-filter"></i>
        <select id="filtro-tipo">
            <option value="">Todos los tipos</option>
            <option value="Ataque">Ataque</option>
            <option value="Soporte">Soporte</option>
            <option value="Tanque">Tanque</option>
            <option value="Especial">Especial</option>
            <option value="Social">Social</option>
            <option value="Exploracion">Exploracion</option>
            <option value="Comunicacion">Comunicacion</option>
        </select>
    </div>

    <div class="filtro-container">
        <i class="fa-solid fa-filter"></i>
        <select id="filtro-terreno">
            <option value="">Todos los terrenos</option>
            <option value="Tierra">Tierra</option>
            <option value="Aire">Aire</option>
            <option value="Agua">Agua</option>
        </select>
    </div>

</div>
